name: CI

# Runs on every push to main and every pull request, and by hand. It used to fail with "No jobs were run" because a step name held a colon, which
# is invalid YAML (found 2026-10-18 from the run's annotation: "error in your yaml syntax on line 25"). Keep step names free of ": ".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The job only reads the code, so its token may only read (a stolen token cannot push or change settings).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency advisories (report only)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build (no database needed, the schema step is skipped outside Vercel)
        run: npx next build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Smoke tests
        run: npm run test:e2e
